<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>戦術対抗戦 編成記録ツール</title>
<meta name="description" content="卓の防衛・攻撃編成をデータ化し傾向を調べ、勝利を掴み取る。">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- SNSでURLを共有したときのカード表示(OGP / Twitter Card)。
     og:imageは絶対URLである必要があるため、本番ドメインを直書きしている -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="戦術対抗戦 編成記録ツール">
<meta property="og:title" content="戦術対抗戦 編成記録ツール">
<meta property="og:description" content="卓の防衛・攻撃編成をデータ化し傾向を調べ、勝利を掴み取る。">
<meta property="og:url" content="https://defense-comp-tracker.vercel.app/">
<meta property="og:image" content="https://defense-comp-tracker.vercel.app/ogp.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="戦術対抗戦 編成記録ツール">
<meta name="twitter:description" content="卓の防衛・攻撃編成をデータ化し傾向を調べ、勝利を掴み取る。">
<meta name="twitter:image" content="https://defense-comp-tracker.vercel.app/ogp.png">
<style>
  :root {
    --accent: #2b8fd9;
    --accent-dark: #1a6eae;
    --bg: #eef4fa;
    --card: #ffffff;
    --border: #d5e2ee;
    --text: #29394a;
    --muted: #7a8ea3;
    --win: #e8890c;
    --lose: #4a90d9;
    --striker: #f0819f;
    --special: #5bb8e0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: linear-gradient(120deg, #1a6eae, #2b8fd9);
    color: #fff;
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  header h1 { margin: 0; font-size: 20px; letter-spacing: 1px; }
  header .x-link {
    margin-left: auto; display: flex; align-items: center; padding: 4px;
    color: rgba(255,255,255,0.72); transition: color 0.15s;
  }
  header .x-link:hover { color: #fff; }
  main { max-width: 1080px; margin: 0 auto; padding: 20px 16px 60px; }
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 20px;
  }
  h2 {
    margin: 0 0 12px;
    font-size: 15px;
    color: var(--accent-dark);
    border-left: 4px solid var(--accent);
    padding-left: 8px;
  }
  h3.subhead { margin: 18px 0 10px; font-size: 13px; color: var(--muted); }
  h3.subhead:first-of-type { margin-top: 4px; }
  #status { margin-top: 10px; font-size: 13px; color: var(--muted); min-height: 18px; }
  #status.error { color: #c0392b; }
  .formrow { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
  .formrow label { font-size: 13px; color: var(--muted); }
  input[type="text"], select {
    font-size: 14px;
    padding: 7px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fbfdff;
  }
  /* D1-4/A1-4とSP1-2をそれぞれ揃った幅の列でグループ化する。SPの方は2枠だけ
     置くが同じ4列グリッドを使うので、D/Aの枠と横幅が揃う。 */
  .chars-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
  .chars-grid-4 .slot { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .chars-grid-4 .slot span { font-size: 11px; color: var(--muted); }
  .chars-grid-4 .slot-input { display: flex; align-items: center; gap: 6px; }
  .chars-grid-4 .slot-input input { flex: 1; min-width: 0; }
  /* キャラアイコン共通。縁取りの色でストライカー(ピンク)/スペシャル(水色)を区別する。
     色はスロット位置ではなくキャラ本来の役割に基づくので、どの画面でも意味が一定になる。 */
  .char-icon {
    border-radius: 50%; object-fit: cover;
    background: #e9f1f9; flex: none;
    border: 2px solid var(--border);
  }
  .char-icon.striker { border-color: var(--striker); }
  .char-icon.special { border-color: var(--special); }
  .char-avatar {
    width: 30px; height: 30px;
    display: none;
  }
  .char-avatar.show { display: block; }
  /* 入力したキャラの実際のロールが、そのスロット(ストライカー/スペシャル)と食い違う場合の警告 */
  .slot-input.mismatch input { border-color: #c0392b; background: #fdeeee; }
  .slot-mismatch-note { font-size: 11px; color: #c0392b; display: none; }
  .slot-mismatch-note.show { display: block; }
  .mode-toggle { margin-bottom: 14px; }
  /* キャラ名入力欄の候補ポップアップ(画像つき)。ネイティブdatalistは画像を
     出せないため自前で描画している。inputの真下にposition:fixedで重ねる */
  .suggest-popup {
    position: fixed;
    z-index: 1000;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(20, 50, 80, 0.16);
    max-height: 260px;
    overflow-y: auto;
    display: none;
  }
  .suggest-item { display: flex; align-items: center; gap: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  .suggest-item:hover, .suggest-item.active { background: #eef4fa; }
  .suggest-item .char-icon { width: 22px; height: 22px; }
  button {
    font-size: 14px;
    padding: 8px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    background: var(--accent);
    color: #fff;
  }
  button:hover { background: var(--accent-dark); }
  button.ghost { background: #e6eef6; color: var(--text); }
  button.ghost:hover { background: #d5e2ee; }
  button.danger { background: none; color: #c0392b; padding: 4px 8px; font-size: 12px; }
  button.danger:hover { background: #fdeeee; }
  /* 履歴の行内ボタン(編集・削除)。縦に細く積んで列幅を取らないようにする */
  .row-actions { white-space: nowrap; }
  button.rowbtn { background: none; color: var(--accent-dark); padding: 3px 6px; font-size: 12px; }
  button.rowbtn:hover { background: #eef4fa; }
  button.rowbtn.danger { color: #c0392b; }
  button.rowbtn.danger:hover { background: #fdeeee; }
  tr.editing-row { background: #fff8e6; }        /* 編集中の行を目立たせる */
  #editNote { font-size: 12px; color: #b06a00; }
  /* 全削除は取り消せないので、他のボタンと明確に見分けがつく色にする */
  button.danger-btn { background: #fdeeee; color: #c0392b; border: 1px solid #f0c4c0; margin-left: auto; }
  button.danger-btn:hover { background: #f9dcda; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  /* 備考は閲覧時にも入力欄らしい枠を付ける */
  .note-cell { min-width: 180px; }
  .note-display {
    display: block; min-height: 48px; padding: 6px 8px;
    border: 1px dashed #a9c8df; border-radius: 6px;
    background: #f8fbfe; color: var(--text); cursor: text;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .note-display[hidden] { display: none; }
  .note-display:hover { border-color: var(--accent); background: #f0f8fd; }
  .note-edit { width: 100%; min-height: 62px; font: inherit; }
  .note-edit:focus { outline: 2px solid rgba(43, 143, 217, 0.25); border-color: var(--accent); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .bar-bg { background: #e9f1f9; border-radius: 4px; height: 14px; min-width: 120px; overflow: hidden; }
  .bar { background: linear-gradient(90deg, #2b8fd9, #64b5f0); height: 100%; border-radius: 4px; }
  .stats-filter { display: flex; gap: 4px; margin-left: auto; }
  .stats-filter button { padding: 4px 10px; font-size: 12px; }
  .pill { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 999px; color: #fff; }
  .pill.Win { background: var(--win); }
  .pill.Lose { background: var(--lose); }
  /* 履歴の編成表示はアイコンのみ(名前はtitle属性でホバー表示)。6人が1行に収まる大きさにする。
     画面が狭いと6個で折り返してしまうので、幅に応じてアイコンを一段小さくする */
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-bottom: 6px; }
  .chips .chips-label { font-size: 11px; color: var(--muted); margin-right: 2px; width: 26px; flex: none; }
  .chips .chip { display: inline-flex; }
  .chips .chip .char-icon { width: 38px; height: 38px; }
  @media (max-width: 900px) {
    .chips { gap: 4px; }
    .chips .chips-label { width: 22px; margin-right: 0; }
    .chips .chip .char-icon { width: 30px; height: 30px; }
  }
  /* 名前セル: アイコン+名前を横並びにする(集計表向け) */
  .name-cell { display: flex; align-items: center; gap: 7px; }
  .name-cell .char-icon { width: 26px; height: 26px; }
  /* ポジション別集計: 各ポジションを列として横並びにし、各列内は縦にキャラを積む */
  .position-stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 20px; }
  .position-block h3 { margin: 0 0 6px; font-size: 13px; color: var(--accent-dark); }
  .position-block table { margin-bottom: 4px; }
  .show-all-btn { background: none; color: var(--accent-dark); padding: 4px 6px; font-size: 12px; }
  .show-all-btn:hover { background: #eef4fa; }
  .sp-pair { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; }
  .sp-pair-separator { color: var(--muted); font-weight: 600; }
  /* 相手別の遭遇回数: 1行1件だと横に間延びするので複数列に流し込む */
  .opp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 2px 18px; }
  .opp-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 5px 2px; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .opp-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .opp-count { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .counts { font-size: 12px; color: var(--muted); margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>戦術対抗戦 編成記録ツール</h1>
  <a class="x-link" href="https://x.com/Kiyui_Archive" target="_blank" rel="noopener noreferrer" title="作者のX（Twitter）" aria-label="作者のX（Twitter）">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
  </a>
</header>
<main>
  <section id="entry">
    <div class="mode-toggle formrow">
      <button id="modeOppAttackBtn">相手の攻撃編成を記録</button>
      <button id="modeOppDefenseBtn" class="ghost">相手の防衛編成を記録</button>
    </div>
    <h2 id="entryTitle">相手の攻撃編成を入力</h2>
    <div class="formrow">
      <label>相手の名前</label>
      <input type="text" id="oppName" size="16">
      <label id="resultLabel">防衛結果</label>
      <select id="defResult">
        <option value="">-</option>
        <option value="Win">Win</option>
        <option value="Lose">Lose</option>
      </select>
    </div>

    <h3 class="subhead" id="oppCompTitle">相手の編成</h3>
    <div class="chars-grid-4" id="oppGridMain"></div>
    <div class="chars-grid-4" id="oppGridSp"></div>

    <h3 class="subhead" id="myCompTitle">自分の編成</h3>
    <div class="chars-grid-4" id="myGridMain"></div>
    <div class="chars-grid-4" id="myGridSp"></div>

    <h3 class="subhead">備考</h3>
    <textarea id="notes" rows="2" style="width: 100%; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: #fbfdff; margin-bottom: 12px; resize: vertical;" placeholder="相手の癖、配置の意図など"></textarea>

    <div class="formrow">
      <button id="saveBtn">この編成を保存</button>
      <button id="clearBtn" class="ghost">クリア</button>
      <span id="editNote" hidden>保存済みの記録を編集中です</span>
      <button id="cancelEditBtn" class="ghost" hidden>編集をやめる</button>
    </div>
    <div id="status"></div>
  </section>

  <section>
    <h2>データのバックアップ</h2>
    <p class="counts" style="margin:0 0 10px;">
      データはこのブラウザ内(localStorage)にのみ保存されます。他の端末・ブラウザには引き継がれないので、
      機種変更やブラウザデータ消去の前に「エクスポート」でバックアップを取ってください。
    </p>
    <div class="formrow">
      <button id="exportBtn" class="ghost">エクスポート(JSONダウンロード)</button>
      <button id="importBtn" class="ghost">インポート(JSONを読み込み)</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button id="deleteAllBtn" class="danger-btn">すべてのデータを削除</button>
    </div>
  </section>

  <section>
    <div class="formrow" style="margin-bottom:12px;">
      <h2 style="margin:0;"><span id="statsTitle">使用キャラ集計</span><span class="counts" id="statTotal"></span></h2>
      <div class="stats-filter" role="group" aria-label="使用キャラ集計の対象">
        <button id="statsAllBtn" type="button">全て</button>
        <button id="statsStBtn" type="button" class="ghost">ST</button>
        <button id="statsSpBtn" type="button" class="ghost">SP</button>
      </div>
    </div>
    <div id="statsTable"></div>
  </section>

  <section>
    <h2 id="positionStatsTitle">ポジション別 使用キャラ集計</h2><span class="counts" id="positionStatTotal"></span>
    <div id="positionStatsTable"></div>
  </section>

  <section>
    <h2 id="spPairStatsTitle">SP組み合わせ集計</h2><span class="counts" id="spPairStatTotal"></span>
    <div id="spPairStatsTable"></div>
  </section>

  <section>
    <h2 id="oppTitle">相手別の遭遇回数</h2><span class="counts" id="oppTotal"></span>
    <div id="oppTable"></div>
  </section>

  <section>
    <div class="formrow" style="margin-bottom:14px;">
      <h2 id="historyTitle" style="margin:0;">保存済み履歴</h2><span class="counts" id="historyTotal"></span>
      <input type="text" id="historySearch" placeholder="相手の名前で検索" style="margin-left:auto; min-width:200px;">
    </div>
    <div id="historyTable"></div>
  </section>
</main>

<script>
"use strict";

const STORAGE_KEY = 'defenseCompRecords'; // ブラウザのlocalStorageに保存(サーバー無しのVercel静的配信のため)
const MY_TEAMS_KEY = 'defenseCompMyTeams'; // 自分側の「今使っている編成」の既定値(入力補助用)
const CHAR_SOURCE_URL = 'https://ba-timeline.vercel.app/characters.json'; // ba-timelineのキャラ一覧をブラウザから直接fetch(CORS許可済み)

// 攻撃編成と防衛編成は対戦の両面としてセットで記録する。
// モードは「相手がどちらの編成を使っているか」を選ぶと、自分側は自動的にもう片方になる。
//   oppAttack: 相手が攻撃してくる(相手=攻撃編成, 自分=防衛編成) — このツール本来の用途
//   oppDefense: 自分が攻撃する(相手=防衛編成, 自分=攻撃編成)
const MODE_CONFIG = {
  oppAttack: {
    title: '相手の攻撃編成',
    oppLabels: ['A1', 'A2', 'A3', 'A4'],
    myLabels: ['D1', 'D2', 'D3', 'D4'],
    myTitle: '自分の防衛編成',
    myTeamKey: 'defense',
    resultLabel: '防衛結果',
  },
  oppDefense: {
    title: '相手の防衛編成',
    oppLabels: ['D1', 'D2', 'D3', 'D4'],
    myLabels: ['A1', 'A2', 'A3', 'A4'],
    myTitle: '自分の攻撃編成',
    myTeamKey: 'attack',
    resultLabel: '攻略結果',
  },
};
const SP_LABELS = ['SP1', 'SP2'];
const POSITION_ROW_LIMIT = 16; // ポジション別集計で最初に表示する件数(超過分は「すべて表示」で開く)
let currentMode = 'oppAttack';
let statsFilter = 'all'; // 使用キャラ集計の対象: all / st(先頭4枠) / sp(後ろ2枠)

let dict = { names: [] };
let records = [];
let myTeamDefaults = { defense: [], attack: [] }; // 自分側の入力補助用デフォルト(入力するたび自動保存)
let editingId = null; // 編集中レコードのid(nullなら新規入力モード)
let charImageByName = new Map(); // キャラ名 -> 画像URL(ba-timelineと共有)
let charRoleByName = new Map();  // キャラ名 -> role("special"/"striker"/"")。ba-timelineのSTRIKER/SPECIAL区分と同じ扱い

// ---------- データ永続化(localStorage) ----------
function loadRecords() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    const list = raw ? JSON.parse(raw) : [];
    // kind, myCharacters, notes の無い旧データをmigrate
    return list.map((r) => ({ kind: 'oppAttack', myCharacters: [], notes: '', ...r }));
  } catch {
    return [];
  }
}

function saveRecords(list) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
}

function loadMyTeamDefaults() {
  try {
    const raw = localStorage.getItem(MY_TEAMS_KEY);
    const parsed = raw ? JSON.parse(raw) : {};
    return { defense: parsed.defense || [], attack: parsed.attack || [] };
  } catch {
    return { defense: [], attack: [] };
  }
}

function saveMyTeamDefaults() {
  localStorage.setItem(MY_TEAMS_KEY, JSON.stringify(myTeamDefaults));
}

// ba-timeline側の isStrikerSlot / KNOWN_SPECIALS と同じ判定:
// role === "special" のみをSPECIAL扱いとし、それ以外(striker/未設定/未登録)はSTRIKER扱いにする。
function isSpecialRole(name) {
  return charRoleByName.get(normalizeName(name)) === 'special';
}

// ---------- ユーティリティ ----------
const $ = (id) => document.getElementById(id);

function normalizeName(s) {
  return s
    .replace(/\s+/g, '')
    .replace(/\(/g, '（').replace(/\)/g, '）')
    .replace(/[*✱✳×]/g, '＊')
    .trim();
}

function setStatus(msg, isError = false) {
  const el = $('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

// ---------- キャラ名候補ポップアップ(画像つき) ----------
// ネイティブ<datalist>は候補に画像を出せないため、自前の候補リストを描画する。
let suggestInput = null;   // 現在ポップアップを出している入力欄
let suggestMatches = [];   // 現在の候補名リスト
let suggestIndex = -1;     // キーボード操作中のハイライト位置

function suggestPopupEl() {
  let el = document.getElementById('suggestPopup');
  if (!el) {
    el = document.createElement('div');
    el.id = 'suggestPopup';
    el.className = 'suggest-popup';
    document.body.append(el);
  }
  return el;
}

function closeSuggest() {
  suggestPopupEl().style.display = 'none';
  suggestInput = null;
  suggestMatches = [];
  suggestIndex = -1;
}

// キャラアイコンのHTML。縁取りの色はキャラ本来の役割(ストライカー=ピンク/
// スペシャル=水色)で決まる。画像が無いキャラは同じ大きさの空丸で埋める。
function charIconHtml(name) {
  const roleClass = charRoleByName.has(name) ? (isSpecialRole(name) ? 'special' : 'striker') : '';
  const img = charImageByName.get(name);
  return img
    ? `<img class="char-icon ${roleClass}" src="${esc(img)}" alt="${esc(name)}">`
    : `<span class="char-icon ${roleClass}"></span>`;
}

// 履歴用: アイコンのみ表示し、名前はホバー時のツールチップで見せる(場所を取らないため)
function charChipHtml(name) {
  return `<span class="chip" title="${esc(name)}">${charIconHtml(name)}</span>`;
}

function showSuggest(input) {
  const isSpecial = input.dataset.special === '1';
  const q = normalizeName(input.value);
  const pool = [...dict.names].filter((n) => isSpecialRole(n) === isSpecial);
  const matches = (q ? pool.filter((n) => n.includes(q)) : pool)
    .sort((a, b) => a.localeCompare(b, 'ja'))
    .slice(0, 8);
  if (!matches.length) return closeSuggest();

  suggestInput = input;
  suggestMatches = matches;
  suggestIndex = -1;

  const el = suggestPopupEl();
  el.innerHTML = matches.map((n, i) =>
    `<div class="suggest-item" data-idx="${i}">${charIconHtml(n)}<span>${esc(n)}</span></div>`).join('');
  el.querySelectorAll('.suggest-item').forEach((item) => {
    const idx = Number(item.dataset.idx);
    item.addEventListener('mousedown', (e) => { e.preventDefault(); selectSuggest(idx); });
    item.addEventListener('mouseenter', () => { suggestIndex = idx; highlightSuggest(); });
  });
  positionSuggest(input, el);
  el.style.display = 'block';
}

function positionSuggest(input, el) {
  const rect = input.getBoundingClientRect();
  el.style.left = `${rect.left}px`;
  el.style.top = `${rect.bottom + 4}px`;
  el.style.width = `${Math.max(rect.width, 160)}px`;
}

function highlightSuggest() {
  const el = suggestPopupEl();
  [...el.children].forEach((child, i) => child.classList.toggle('active', i === suggestIndex));
  const activeEl = el.children[suggestIndex];
  if (activeEl) activeEl.scrollIntoView({ block: 'nearest' });
}

function selectSuggest(idx) {
  if (!suggestInput || idx < 0 || idx >= suggestMatches.length) return;
  const input = suggestInput;
  input.value = suggestMatches[idx];
  input.dispatchEvent(new Event('input', { bubbles: true }));
  closeSuggest();
  input.focus();
}

function attachAutocomplete(input) {
  input.addEventListener('focus', () => showSuggest(input));
  input.addEventListener('blur', () => setTimeout(closeSuggest, 120)); // 候補クリックのmousedownを先に処理させる
  input.addEventListener('keydown', (e) => {
    if (suggestInput !== input || suggestPopupEl().style.display === 'none') return;
    if (e.key === 'ArrowDown') { e.preventDefault(); suggestIndex = Math.min(suggestIndex + 1, suggestMatches.length - 1); highlightSuggest(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); suggestIndex = Math.max(suggestIndex - 1, 0); highlightSuggest(); }
    else if (e.key === 'Enter') { if (suggestIndex >= 0) { e.preventDefault(); selectSuggest(suggestIndex); } }
    else if (e.key === 'Escape') { closeSuggest(); }
    else if (e.key === 'Tab') {
      // マウス無しでも6枠を素早く埋められるように、Tabで次へ移る前に候補を確定する。
      // ただし空欄のまま(未入力スロットを飛ばしたいだけ)ならTabの既定動作(移動のみ)に任せる。
      // preventDefaultはしない = Tab本来のフォーカス移動はそのまま活きる。
      if (!input.value.trim()) return;
      const exact = normalizeName(input.value);
      const idx = suggestMatches.includes(exact) ? suggestMatches.indexOf(exact) : (suggestIndex >= 0 ? suggestIndex : 0);
      const name = suggestMatches[idx];
      if (name && name !== exact) {
        input.value = name;
        input.dispatchEvent(new Event('input', { bubbles: true }));
      }
      closeSuggest();
    }
  });
}

// ---------- 入力フォーム(共通スロットUI) ----------
// 1スロット分(ラベル・顔アイコン・入力欄・役割食い違い警告)を組み立てる。
// isSpecial: このスロットがSP(スペシャル)枠かどうか(D1-4/A1-4はfalse、SP1-2はtrue)
function buildCharSlot(labelText, isSpecial, onInput) {
  const slot = document.createElement('div');
  slot.className = 'slot';
  const label = document.createElement('span');
  label.textContent = labelText;
  const inputWrap = document.createElement('div');
  inputWrap.className = 'slot-input';
  const avatar = document.createElement('img');
  avatar.className = 'char-icon char-avatar';
  avatar.alt = '';
  const input = document.createElement('input');
  input.type = 'text';
  input.autocomplete = 'off';
  input.dataset.special = isSpecial ? '1' : '0';
  input.addEventListener('input', () => { syncAvatar(input); showSuggest(input); if (onInput) onInput(); });
  attachAutocomplete(input);
  inputWrap.append(avatar, input);
  const mismatchNote = document.createElement('div');
  mismatchNote.className = 'slot-mismatch-note';
  mismatchNote.textContent = isSpecial ? '⚠ ストライカーのキャラです' : '⚠ スペシャルのキャラです';
  slot.append(label, inputWrap, mismatchNote);
  return slot;
}

function buildGrids(mainId, spId, labels, onInput) {
  const mainGrid = $(mainId);
  const spGrid = $(spId);
  mainGrid.innerHTML = '';
  spGrid.innerHTML = '';
  labels.forEach((l) => mainGrid.append(buildCharSlot(l, false, onInput)));
  SP_LABELS.forEach((l) => spGrid.append(buildCharSlot(l, true, onInput)));
}

function gridInputs(mainId, spId) {
  return [...$(mainId).querySelectorAll('input'), ...$(spId).querySelectorAll('input')];
}

function fillGrid(mainId, spId, values) {
  gridInputs(mainId, spId).forEach((input, i) => {
    input.value = (values && values[i]) || '';
    syncAvatar(input);
  });
}

// 入力欄の値がキャラ辞書と一致したら隣に顔アイコンを表示し、
// スロット(ストライカー/スペシャル)と実際のロールが食い違っていれば警告する
function syncAvatar(input) {
  const inputWrap = input.parentElement;
  const avatar = inputWrap.querySelector('.char-avatar');
  const mismatchNote = inputWrap.nextElementSibling;
  const name = normalizeName(input.value);
  const image = charImageByName.get(name);
  const known = charRoleByName.has(name);
  avatar.classList.toggle('striker', known && !isSpecialRole(name));
  avatar.classList.toggle('special', known && isSpecialRole(name));
  if (image) {
    avatar.src = image;
    avatar.classList.add('show');
  } else {
    avatar.classList.remove('show');
    avatar.src = '';
  }

  const isSpecialSlot = input.dataset.special === '1';
  const mismatch = name && known && isSpecialRole(name) !== isSpecialSlot;
  inputWrap.classList.toggle('mismatch', mismatch);
  mismatchNote.classList.toggle('show', mismatch);
}

function syncAllAvatars() {
  for (const input of document.querySelectorAll('.chars-grid-4 input')) syncAvatar(input);
}

// 自分側の入力欄が変わるたびに既定値として自動保存する(次回以降の入力補助のため、
// 明示的な保存操作は不要にしてある)。
// ただし過去の記録を編集中は保存しない。昔の編成を直しただけで「普段使っている編成」の
// 既定値が上書きされてしまうのを防ぐため。
function persistMyTeamDefault() {
  if (editingId) return;
  const key = MODE_CONFIG[currentMode].myTeamKey;
  myTeamDefaults[key] = gridInputs('myGridMain', 'myGridSp').map((i) => normalizeName(i.value));
  saveMyTeamDefaults();
}

function clearOpponentEntry() {
  $('oppName').value = '';
  $('defResult').value = '';
  for (const input of gridInputs('oppGridMain', 'oppGridSp')) { input.value = ''; syncAvatar(input); }
  $('notes').value = '';
  $('oppName').focus();
  setStatus('');
}

// ---------- モード切り替え(相手が攻撃 / 相手が防衛) ----------
function setMode(mode) {
  currentMode = mode;
  const cfg = MODE_CONFIG[mode];
  $('modeOppAttackBtn').classList.toggle('ghost', mode !== 'oppAttack');
  $('modeOppDefenseBtn').classList.toggle('ghost', mode !== 'oppDefense');
  $('entryTitle').textContent = `${cfg.title}を入力`;
  $('resultLabel').textContent = cfg.resultLabel;
  $('oppCompTitle').textContent = `相手の編成(${cfg.title})`;
  $('myCompTitle').textContent = cfg.myTitle;

  buildGrids('oppGridMain', 'oppGridSp', cfg.oppLabels);
  buildGrids('myGridMain', 'myGridSp', cfg.myLabels, persistMyTeamDefault);
  fillGrid('myGridMain', 'myGridSp', myTeamDefaults[cfg.myTeamKey]);

  // モードを跨いだ編集は成立しないので、切り替え時は編集状態を解除する
  // (startEditはこの後にeditingIdを立てるため影響を受けない)
  editingId = null;
  setEditUi(false);
  clearOpponentEntry();
  renderAll();
}

// ---------- 保存 ----------
async function saveRecord() {
  const opponentChars = gridInputs('oppGridMain', 'oppGridSp').map((i) => normalizeName(i.value)).filter(Boolean);
  if (!opponentChars.length) return setStatus('相手のキャラ名が入っていません。', true);
  const myChars = gridInputs('myGridMain', 'myGridSp').map((i) => normalizeName(i.value)).filter(Boolean);

  const opponent = { name: $('oppName').value.trim() };
  const defenseResult = $('defResult').value || null;
  const notes = $('notes').value.trim();

  // 編集モード: 既存レコードを上書きする(id・保存日時は元のまま維持し、履歴の並びを動かさない)
  if (editingId) {
    const target = records.find((r) => r.id === editingId);
    if (!target) { // 別タブで消された等
      cancelEdit();
      return setStatus('編集対象の記録が見つかりませんでした。', true);
    }
    Object.assign(target, { kind: currentMode, opponent, defenseResult, characters: opponentChars, myCharacters: myChars, notes });
    saveRecords(records);
    finishEdit();          // 自分の編成欄は通常運用の既定値に戻す
    await refresh();
    return setStatus('記録を更新しました。');
  }

  // 重複チェックは保存を止めない(「匿名」など同名が被っても別記録として残す)。
  // 同じモード・同じ相手名+同じ編成が既にあれば、保存はした上で通知だけする。
  const key = (chars) => [...chars].sort().join('|');
  const dup = records.some((r) =>
    (r.kind || 'oppAttack') === currentMode &&
    r.opponent.name === opponent.name &&
    key(r.characters) === key(opponentChars));

  const record = {
    id: crypto.randomUUID(),
    savedAt: new Date().toISOString(),
    kind: currentMode,
    opponent,
    defenseResult,
    characters: opponentChars,
    myCharacters: myChars,
    notes,
  };
  records.push(record);
  saveRecords(records);
  persistMyTeamDefault(); // 自分側は保存時点の内容を次回以降の既定値として引き継ぐ
  await refresh();
  clearOpponentEntry(); // 相手側だけクリアする。自分の編成は使い回すため残す
  setStatus(dup ? '保存しました(同じ相手・同じ編成の記録が既にありました)。' : '保存しました。');
}

// ---------- 保存済み記録の編集 ----------
// 専用の編集UIは作らず、既存の入力フォームに読み込んで上書き保存する方式にしている。
function startEdit(id) {
  const rec = records.find((r) => r.id === id);
  if (!rec) return;

  // 記録のモードと画面のモードが違えばラベルが噛み合わないので合わせる。
  // setModeはフォームを初期化するので、値の流し込みは必ずこの後に行う。
  if ((rec.kind || 'oppAttack') !== currentMode) setMode(rec.kind || 'oppAttack');

  editingId = id;
  $('oppName').value = rec.opponent.name || '';
  $('defResult').value = rec.defenseResult || '';
  $('notes').value = rec.notes || '';
  fillGrid('oppGridMain', 'oppGridSp', rec.characters);
  fillGrid('myGridMain', 'myGridSp', rec.myCharacters || []);
  setEditUi(true);
  renderAll();                                    // 編集中の行にマーカーを付ける
  $('entry').scrollIntoView({ behavior: 'smooth', block: 'start' });
  setStatus('編集中です。内容を直して「変更を保存」を押してください。');
}

// 編集をやめてフォームを通常状態に戻す(自分の編成欄は普段の既定値へ)
function finishEdit() {
  editingId = null;
  setEditUi(false);
  fillGrid('myGridMain', 'myGridSp', myTeamDefaults[MODE_CONFIG[currentMode].myTeamKey]);
  clearOpponentEntry();
}

function cancelEdit() {
  if (!editingId) return;
  finishEdit();
  renderAll();
  setStatus('編集をやめました。');
}

function setEditUi(on) {
  $('saveBtn').textContent = on ? '変更を保存' : 'この編成を保存';
  $('editNote').hidden = !on;
  $('cancelEditBtn').hidden = !on;
}

// ---------- 表示 ----------
async function refresh() {
  records = loadRecords();
  myTeamDefaults = loadMyTeamDefaults();

  // ba-timelineのキャラ一覧をブラウザから直接取得(サーバーを挟まない)。
  // 取れなくても保存済みレコードの名前だけで動作は継続する。
  let characters = [];
  try {
    const res = await fetch(CHAR_SOURCE_URL);
    if (res.ok) characters = await res.json();
  } catch (e) {
    console.error('キャラ一覧の取得に失敗:', e);
  }
  // ba-timeline側の名前は半角括弧("アヤネ(水着)")、こちらの保存データは
  // normalizeNameで全角括弧に統一している。ここで揃えないと衣装違いキャラの
  // 画像がほぼ全部マッチしなくなる(過去の不具合の原因)。
  const charBase = new URL(CHAR_SOURCE_URL).origin;
  const normalizedChars = characters.map((c) => ({ ...c, name: normalizeName(c.name) }));

  const names = new Set(normalizedChars.map((c) => c.name));
  for (const r of records) {
    for (const name of [...(r.characters || []), ...(r.myCharacters || [])]) if (name) names.add(name);
  }
  dict = { names: [...names] };
  charImageByName = new Map(normalizedChars.map((c) => [c.name, charBase + c.image]));
  charRoleByName = new Map(normalizedChars.map((c) => [c.name, c.role || '']));

  syncAllAvatars();
  renderAll();
}

function renderAll() {
  const cfg = MODE_CONFIG[currentMode];
  const scoped = records.filter((r) => (r.kind || 'oppAttack') === currentMode);
  const totalText = scoped.length ? `全${scoped.length}件` : '';

  $('statsTitle').textContent = `使用キャラ集計(${cfg.title})`;
  $('positionStatsTitle').textContent = `ポジション別 使用キャラ集計(${cfg.title})`;
  $('spPairStatsTitle').textContent = `SP組み合わせ集計(${cfg.title})`;
  $('oppTitle').textContent = `相手別の遭遇回数(${cfg.title})`;
  $('historyTitle').textContent = `保存済み履歴(${cfg.title})`;
  $('positionStatTotal').textContent = totalText;
  $('spPairStatTotal').textContent = totalText;
  $('oppTotal').textContent = totalText;
  $('historyTotal').textContent = ''; // 履歴は検索結果件数を別で表示するので、通常は空
  $('statsAllBtn').classList.toggle('ghost', statsFilter !== 'all');
  $('statsStBtn').classList.toggle('ghost', statsFilter !== 'st');
  $('statsSpBtn').classList.toggle('ghost', statsFilter !== 'sp');
  renderStats(scoped);
  // SPはスロット位置で役割が変わらないので、SP1/SP2は「SP」として1つにまとめて集計する
  const groups = [
    ...cfg.oppLabels.map((label, i) => ({ label, indices: [i] })),
    { label: 'SP', indices: [4, 5] },
  ];
  renderPositionStats(scoped, groups);
  renderSpPairStats(scoped);
  renderOpponents(scoped);

  // 履歴だけは検索欄の文字で絞り込む(集計・ポジション別等は全件のまま)
  const q = $('historySearch').value.trim().toLowerCase();
  const filtered = q ? scoped.filter((r) => r.opponent.name.toLowerCase().includes(q)) : scoped;
  renderHistory(filtered, q ? scoped.length : null);
}

function renderStats(list) {
  const total = list.length;
  $('statTotal').textContent = total ? `全${total}件` : ''; // このセクションは元から件数表示があったのでそのまま
  if (!total) {
    $('statsTable').innerHTML = '<div class="empty">まだデータがありません。編成を入力して保存すると集計されます。</div>';
    return;
  }
  const counts = new Map();
  for (const r of list) {
    const characters = statsFilter === 'st' ? r.characters.slice(0, 4)
      : statsFilter === 'sp' ? r.characters.slice(4, 6)
      : r.characters;
    for (const c of new Set(characters.filter(Boolean))) counts.set(c, (counts.get(c) || 0) + 1);
  }
  const rows = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'));
  if (!rows.length) {
    $('statsTable').innerHTML = '<div class="empty">この区分に使用キャラのデータがありません。</div>';
    return;
  }
  const max = rows[0][1];
  $('statsTable').innerHTML = `
    <table>
      <thead><tr><th>キャラ</th><th style="width:70px;text-align:right">回数</th><th style="width:80px;text-align:right">採用率</th><th></th></tr></thead>
      <tbody>${rows.map(([name, n]) => `
        <tr>
          <td><div class="name-cell">${charIconHtml(name)}<span>${esc(name)}</span></div></td>
          <td class="num">${n}</td>
          <td class="num">${(n / total * 100).toFixed(1)}%</td>
          <td><div class="bar-bg"><div class="bar" style="width:${(n / max * 100).toFixed(1)}%"></div></div></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

// groups: [{ label, indices }] — 1グループが複数スロットを束ねられる(SP1+SP2→「SP」など)
function renderPositionStats(list, groups) {
  const total = list.length;
  const container = $('positionStatsTable');

  if (!total) {
    container.innerHTML = '<div class="empty">まだデータがありません。</div>';
    return;
  }

  // グループごとのキャラ使用回数を集計
  const positionCounts = groups.map(() => new Map());
  for (const r of list) {
    groups.forEach((g, gi) => {
      const counts = positionCounts[gi];
      for (const i of g.indices) {
        const char = r.characters[i];
        if (char) counts.set(char, (counts.get(char) || 0) + 1);
      }
    });
  }

  let html = '<div class="position-stats-grid">';
  positionCounts.forEach((counts, i) => {
    const rows = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'));
    html += `<div class="position-block"><h3>${groups[i].label}</h3>`;
    if (rows.length === 0) {
      html += '<table><tr><td>データなし</td></tr></table>';
    } else {
      // 縦に長くなりすぎないよう、POSITION_ROW_LIMIT件を超える分は「すべて表示」まで隠す
      const hidden = rows.length > POSITION_ROW_LIMIT;
      const rowHtml = (r, idx) => `<tr${hidden && idx >= POSITION_ROW_LIMIT ? ' class="extra-row" hidden' : ''}>` +
        `<td><div class="name-cell">${charIconHtml(r[0])}<span>${esc(r[0])}</span></div></td>` +
        `<td class="num">${r[1]}回</td></tr>`;
      html += `<table>${rows.map(rowHtml).join('')}</table>`;
      if (hidden) {
        html += `<button class="show-all-btn" data-showall>すべて表示 (残り${rows.length - POSITION_ROW_LIMIT}件)</button>`;
      }
    }
    html += '</div>';
  });
  container.innerHTML = html + '</div>';

  container.querySelectorAll('[data-showall]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const block = btn.closest('.position-block');
      const hiddenRows = block.querySelectorAll('.extra-row[hidden]');
      if (hiddenRows.length) {
        hiddenRows.forEach((tr) => tr.removeAttribute('hidden'));
        btn.textContent = '折りたたむ';
      } else {
        const extras = block.querySelectorAll('.extra-row');
        extras.forEach((tr) => tr.setAttribute('hidden', ''));
        btn.textContent = `すべて表示 (残り${extras.length}件)`;
      }
    });
  });
}

// SP1/SP2の左右を区別せず、同じ2人を1つの組み合わせとして集計する
function renderSpPairStats(list) {
  const container = $('spPairStatsTable');
  const total = list.length;
  if (!total) {
    container.innerHTML = '<div class="empty">まだデータがありません。</div>';
    return;
  }

  const counts = new Map();
  for (const r of list) {
    const pair = (r.characters || []).slice(4, 6).filter(Boolean)
      .sort((a, b) => a.localeCompare(b, 'ja'));
    // SPが片方しか入力されていない記録は、組み合わせ集計の対象外にする
    if (pair.length !== 2) continue;
    const key = JSON.stringify(pair);
    counts.set(key, (counts.get(key) || 0) + 1);
  }

  const rows = [...counts.entries()]
    .map(([key, count]) => ({ pair: JSON.parse(key), count }))
    .sort((a, b) => b.count - a.count || a.pair.join('').localeCompare(b.pair.join(''), 'ja'));
  if (!rows.length) {
    container.innerHTML = '<div class="empty">SPが2人そろった記録がありません。</div>';
    return;
  }

  const max = rows[0].count;
  container.innerHTML = `
    <table>
      <thead><tr><th>SPの組み合わせ</th><th style="width:70px;text-align:right">使用数</th><th style="width:80px;text-align:right">使用率</th><th></th></tr></thead>
      <tbody>${rows.map(({ pair, count }) => `
        <tr>
          <td><div class="sp-pair">
            <div class="name-cell">${charIconHtml(pair[0])}<span>${esc(pair[0])}</span></div>
            <span class="sp-pair-separator">＋</span>
            <div class="name-cell">${charIconHtml(pair[1])}<span>${esc(pair[1])}</span></div>
          </div></td>
          <td class="num">${count}</td>
          <td class="num">${(count / total * 100).toFixed(1)}%</td>
          <td><div class="bar-bg"><div class="bar" style="width:${(count / max * 100).toFixed(1)}%"></div></div></td>
        </tr>`).join('')}
      </tbody>
    </table>`;
}

function renderOpponents(list) {
  if (!list.length) {
    $('oppTable').innerHTML = '<div class="empty">まだデータがありません。</div>';
    return;
  }
  const counts = new Map();
  for (const r of list) {
    const label = r.opponent.name || '(名前なし)';
    counts.set(label, (counts.get(label) || 0) + 1);
  }
  const rows = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0], 'ja'));
  // 1列の表にすると相手名が短い割に横幅を使い切ってしまうので、
  // 複数列に折り返すグリッドにして縦にも横にも詰める
  $('oppTable').innerHTML = `
    <div class="opp-grid">${rows.map(([name, n]) => `
      <div class="opp-item"><span class="opp-name">${esc(name)}</span><span class="opp-count">${n}</span></div>`).join('')}
    </div>`;
}

// totalCount: 検索で絞り込んでいるときだけ渡す(全件中の何件かを表示するため)
function renderHistory(list, totalCount) {
  if (totalCount != null) {
    $('historyTotal').textContent = `${totalCount}件中 ${list.length}件`;
  }
  const countNote = ''; // 件数表示をタイトル横に集約したので、テーブル上のテキストは不要
  if (!list.length) {
    $('historyTable').innerHTML = countNote + `<div class="empty">${totalCount != null ? '一致する記録がありません。' : 'まだデータがありません。'}</div>`;
    return;
  }
  const rows = [...list].reverse();
  $('historyTable').innerHTML = countNote + `
    <table>
      <thead><tr><th style="width:96px">日時</th><th style="width:110px">相手</th><th style="width:56px">結果</th><th>相手の編成 / 自分の編成</th><th>備考</th><th style="width:64px"></th></tr></thead>
      <tbody>${rows.map((r) => {
        const note = r.notes || '';
        const truncatedNote = note.length > 30 ? note.substring(0, 30) + '…' : note;
        return `
        <tr${r.id === editingId ? ' class="editing-row"' : ''}>
          <td>${new Date(r.savedAt).toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
          <td>${esc(r.opponent.name)}</td>
          <td>${r.defenseResult ? `<span class="pill ${r.defenseResult}">${r.defenseResult}</span>` : '－'}</td>
          <td>
            <div class="chips"><span class="chips-label">相手</span>${r.characters.map(charChipHtml).join('')}</div>
            <div class="chips"><span class="chips-label">自分</span>${(r.myCharacters && r.myCharacters.length) ? r.myCharacters.map(charChipHtml).join('') : '<span class="empty" style="padding:0;display:inline;">(未入力)</span>'}</div>
          </td>
          <td class="note-cell">
            <span class="note-display" title="${esc(note)}" data-id="${r.id}">${esc(truncatedNote) || '備考を入力'}</span>
            <textarea class="note-edit" data-id="${r.id}" hidden></textarea>
          </td>
          <td class="row-actions">
            <button class="rowbtn" data-edit="${r.id}">編集</button>
            <button class="rowbtn danger" data-del="${r.id}">削除</button>
          </td>
        </tr>`}).join('')}
      </tbody>
    </table>`;
  $('historyTable').querySelectorAll('[data-edit]').forEach((btn) => {
    btn.addEventListener('click', () => startEdit(btn.dataset.edit));
  });
  $('historyTable').querySelectorAll('[data-del]').forEach((btn) => {
    btn.addEventListener('click', async () => {
      if (!confirm('この記録を削除しますか？')) return;
      if (btn.dataset.del === editingId) cancelEdit(); // 編集中の行が消えたらフォームも戻す
      records = records.filter((r) => r.id !== btn.dataset.del);
      saveRecords(records);
      await refresh();
    });
  });

  // 備考セルをダブルクリックすると、その場で編集できる
  $('historyTable').querySelectorAll('.note-cell').forEach((td) => {
    td.addEventListener('dblclick', () => {
      const span = td.querySelector('.note-display');
      const textarea = td.querySelector('.note-edit');
      if (!textarea.hidden) return;

      const record = records.find(rec => rec.id === span.dataset.id);
      if (!record) return;

      const handleBlur = () => {
        textarea.removeEventListener('blur', handleBlur);
        textarea.removeEventListener('keydown', handleKeydown);

        if (textarea.value.trim() !== (record.notes || '')) {
          record.notes = textarea.value.trim();
          saveRecords(records);
          refresh();
        } else {
          span.hidden = false;
          textarea.hidden = true;
        }
      };

      const handleKeydown = (e) => {
        if (e.key === 'Escape') {
          e.preventDefault();
          textarea.value = record.notes || '';
          textarea.blur();
        } else if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          textarea.blur();
        }
      };

      span.hidden = true;
      textarea.value = record.notes || '';
      textarea.hidden = false;
      textarea.focus();

      textarea.addEventListener('blur', handleBlur);
      textarea.addEventListener('keydown', handleKeydown);
    });
  });
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// ---------- バックアップ(エクスポート/インポート) ----------
function exportRecords() {
  const blob = new Blob([JSON.stringify({ records, myTeamDefaults }, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `戦術対抗戦編成記録_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

// 保存済みの対戦記録と自分の編成をすべて消す。取り消せないので二段階で確認する。
async function deleteAllData() {
  if (!records.length && !myTeamDefaults.defense.length && !myTeamDefaults.attack.length) {
    return setStatus('削除するデータがありません。');
  }
  if (!confirm(`保存済みの${records.length}件の記録と、自分の編成をすべて削除します。
この操作は取り消せません。

先に「エクスポート」でバックアップを取ることを強くおすすめします。

続行しますか？`)) return;
  if (!confirm('本当に削除しますか？（最終確認）')) return;

  localStorage.removeItem(STORAGE_KEY);
  localStorage.removeItem(MY_TEAMS_KEY);
  records = [];
  myTeamDefaults = { defense: [], attack: [] };
  editingId = null;
  setEditUi(false);
  await refresh();
  fillGrid('myGridMain', 'myGridSp', []); // 自分の編成欄も画面から消す
  clearOpponentEntry();
  setStatus('すべてのデータを削除しました。');
}

// 旧ローカルサーバー版のdata.json({records:[...]})と、エクスポート済みJSON({records,myTeamDefaults})の
// どちらも受け付ける。既存データとはid重複を除いてマージする(同じファイルを二重インポートしても増えない)。
// kindが無い古いレコードはoppAttack扱い(モード分割前はこの用途だったため)。myCharactersも無ければ空扱い。
async function importRecords(file) {
  let parsed;
  try {
    parsed = JSON.parse(await file.text());
  } catch (e) {
    return setStatus('JSONの読み込みに失敗しました: ' + e.message, true);
  }
  const incoming = Array.isArray(parsed) ? parsed : parsed.records;
  if (!Array.isArray(incoming)) return setStatus('records配列が見つかりません。', true);

  const existingIds = new Set(records.map((r) => r.id));
  let added = 0;
  for (const r of incoming) {
    if (!r || !Array.isArray(r.characters) || !r.characters.length) continue;
    const id = r.id && !existingIds.has(r.id) ? r.id : crypto.randomUUID();
    existingIds.add(id);
    records.push({
      id,
      savedAt: r.savedAt || new Date().toISOString(),
      kind: r.kind === 'oppDefense' ? 'oppDefense' : 'oppAttack',
      opponent: { name: String(r.opponent?.name ?? '').trim() },
      defenseResult: r.defenseResult === 'Win' || r.defenseResult === 'Lose' ? r.defenseResult : null,
      characters: r.characters.map((c) => String(c).trim()).filter(Boolean),
      myCharacters: Array.isArray(r.myCharacters) ? r.myCharacters.map((c) => String(c).trim()).filter(Boolean) : [],
      notes: String(r.notes || '').trim(),
しよ    });
    added++;
  }
  saveRecords(records);
  const importedDefaults = parsed.myTeamDefaults || parsed.myTeams; // myTeamsは旧エクスポート形式との互換
  if (!Array.isArray(parsed) && importedDefaults) {
    myTeamDefaults = { defense: importedDefaults.defense || [], attack: importedDefaults.attack || [] };
    saveMyTeamDefaults();
  }
  await refresh();
  setStatus(`${added}件を読み込みました。`);
}

// ---------- 入力イベント ----------
$('modeOppAttackBtn').addEventListener('click', () => setMode('oppAttack'));
$('modeOppDefenseBtn').addEventListener('click', () => setMode('oppDefense'));
['all', 'st', 'sp'].forEach((filter) => {
  $(`stats${filter[0].toUpperCase()}${filter.slice(1)}Btn`).addEventListener('click', () => {
    statsFilter = filter;
    renderAll();
  });
});
$('saveBtn').addEventListener('click', saveRecord);
// 「クリア」は編集中なら編集の取り消しも兼ねる(入力欄だけ空になって
// 保存すると元の記録を空で上書きしてしまう、という事故を防ぐため)
$('clearBtn').addEventListener('click', () => (editingId ? cancelEdit() : clearOpponentEntry()));
$('cancelEditBtn').addEventListener('click', cancelEdit);
// 履歴の検索: 集計等は再計算せず履歴の表示だけ絞り込むので、renderAllを呼び直せば十分軽い
$('historySearch').addEventListener('input', renderAll);
$('exportBtn').addEventListener('click', exportRecords);
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', () => {
  const file = $('importFile').files[0];
  if (file) importRecords(file);
  $('importFile').value = '';
});
$('deleteAllBtn').addEventListener('click', deleteAllData);

myTeamDefaults = loadMyTeamDefaults();
setMode('oppAttack');
refresh();
</script>
